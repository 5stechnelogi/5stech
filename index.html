
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5S Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#eef1f5; --surface3:#e2e7ee; --line:#dde3ea;
    --text:#171b22; --muted:#69707d; --amber:#2563eb; --amber-dim:#dbe7fb; --steel:#2f6da6; --red:#d8342a; --green:#1f8a5f;
    --shadow-sm:0 2px 6px rgba(23,27,34,.06);
    --shadow-md:0 10px 24px rgba(23,27,34,.10);
    --shadow-lg:0 24px 54px rgba(23,27,34,.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--amber); color:#fff;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .hex{clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); display:flex; align-items:center; justify-content:center;}

  .wrap{max-width:1280px; margin:0 auto; padding:0 24px;}
  .announce{background:linear-gradient(90deg,var(--amber),#4f8cf7); color:#fff; font-size:13px; font-weight:700; padding:10px 0; overflow:hidden; white-space:nowrap; position:relative;}
  .announce-track{display:inline-flex; align-items:center; animation:announceScroll 18s linear infinite;}
  .announce:hover .announce-track{animation-play-state:paused;}
  .announce-track span{padding:0 40px; display:inline-block;}
  @keyframes announceScroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  header.site{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
  .header-row{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:20px; flex-wrap:wrap;}
  .logo{display:flex; align-items:center; gap:11px; font-size:21px; font-weight:700; cursor:pointer;}
  .logo .hex{width:36px; height:36px; background:linear-gradient(145deg,var(--amber),#1743a6); color:#fff; font-weight:700; font-size:14px; box-shadow:0 6px 16px rgba(37,99,235,.30);}
  .search-box{flex:1; min-width:200px; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--line); border-radius:6px; padding:10px 14px; transition:.15s;}
  .search-box:focus-within{border-color:var(--steel); box-shadow:0 0 0 3px rgba(47,109,166,.12);}
  .search-box input{background:none; border:none; color:var(--text); font-size:14px; width:100%; outline:none;}
  .search-box .clear-x{background:none; color:var(--muted); font-size:13px; opacity:.7;}
  .search-box .clear-x:hover{opacity:1; color:var(--red);}
  .search-box.compact{flex:0 0 auto; width:240px; max-width:240px; min-width:0; padding:9px 12px; border-radius:21px; animation:searchGrow .18s ease both;}
  .search-box.compact svg{width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
  @keyframes searchGrow{from{width:42px; opacity:.4;} to{width:240px; opacity:1;}}
  .icon-btn.ico-search{color:var(--steel);}
  .icon-btn.ico-search:hover{background:var(--steel); border-color:var(--steel); color:#fff;}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{position:relative; background:var(--surface2); border:1px solid var(--line); color:var(--steel); opacity:1; transition:.18s; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(23,27,34,.05);}
  .icon-btn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:.18s;}
  .icon-btn:hover{transform:translateY(-2px); box-shadow:0 8px 16px rgba(37,99,235,.22);}
  .icon-btn.ico-user{color:var(--steel);}
  .icon-btn.ico-user:hover, .icon-btn.ico-user.active-acc{background:var(--steel); border-color:var(--steel); color:#fff;}
  .icon-btn.ico-cart{color:var(--amber);}
  .icon-btn.ico-cart:hover{background:var(--amber); border-color:var(--amber); color:#fff;}
  .icon-btn.ico-settings{color:var(--muted);}
  .icon-btn.ico-settings:hover{background:var(--text); border-color:var(--text); color:#fff; transform:translateY(-2px) rotate(45deg);}
  .cart-badge{position:absolute; top:-3px; right:-3px; background:var(--red); color:#fff; font-size:10px; font-weight:700; min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; font-family:'Inter',sans-serif; border:2px solid var(--surface); box-shadow:0 2px 6px rgba(216,52,42,.4);}
  nav.catnav{border-bottom:1px solid var(--line); background:var(--surface);}
  .catnav-row{display:flex; gap:2px; overflow-x:auto; padding:0 24px;}
  .catnav-row a, .catnav-row button{background:none; color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:.05em; padding:14px 16px; white-space:nowrap; border-bottom:2px solid transparent; transition:.15s;}
  .catnav-row a:hover, .catnav-row button:hover{color:var(--text); border-color:var(--steel);}
  .catnav-row a.active, .catnav-row button.active{color:var(--amber); border-color:var(--amber);}

  .overlay{position:fixed; inset:0; background:rgba(23,27,34,.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadeUp .18s ease both;}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:14px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:18px;}
  .modal-body{padding:24px;}
  .x-close{background:none; color:var(--muted); font-size:20px; width:32px; height:32px; border-radius:8px;}
  .x-close:hover{color:var(--text); background:var(--surface2);}

  label{display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:6px; margin-top:16px; text-transform:uppercase; letter-spacing:.04em;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=password], input[type=url], select, textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px; color:var(--text); font-size:13.5px; outline:none; font-family:inherit; transition:.15s;}
  input:focus, select:focus, textarea:focus{border-color:var(--steel); box-shadow:0 0 0 3px rgba(47,109,166,.12);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .check-row{display:flex; align-items:center; gap:8px; margin-top:14px;}
  .check-row input{width:auto;}
  .check-row label{margin:0; text-transform:none; font-size:13px; color:var(--text); font-weight:500;}

  .hero{position:relative; min-height:460px; display:flex; align-items:center; background:
      radial-gradient(circle at 85% 15%, rgba(37,99,235,.14), transparent 45%),
      linear-gradient(115deg, #eef1f5 0%, #f8f9fb 55%, #ffffff 100%);
    overflow:hidden; border-bottom:1px solid var(--line);}
  .hero::before{content:""; position:absolute; inset:0; background-image:
      linear-gradient(rgba(23,27,34,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,27,34,.05) 1px, transparent 1px);
    background-size:42px 42px; mask-image:radial-gradient(circle at 78% 30%, #000 0%, transparent 62%); opacity:.6;}
  .hero-slides{position:absolute; inset:0; display:flex; height:100%; transition:transform .55s cubic-bezier(.4,0,.2,1); touch-action:pan-y;}
  .hero-slide{position:relative; height:100%; flex-shrink:0; background-size:cover; background-position:center;}
  .hero.has-img::before{display:none;}
  .hero-scrim{position:absolute; inset:0; z-index:1; background:linear-gradient(100deg, rgba(15,18,24,.72) 0%, rgba(15,18,24,.52) 32%, rgba(15,18,24,.12) 60%, rgba(15,18,24,0) 78%);}
  .hero-overlay{position:absolute; inset:0; background:linear-gradient(95deg,rgba(255,255,255,.97) 25%,rgba(255,255,255,.55) 78%);}
  .hero-arrow{position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.9); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--text); box-shadow:var(--shadow-md); z-index:4; transition:.15s;}
  .hero-arrow:hover{background:#fff; color:var(--amber); transform:translateY(-50%) scale(1.07);}
  .hero-arrow.prev{left:16px;}
  .hero-arrow.next{right:16px;}
  .hero-dots{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:4;}
  .hero-dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.5); transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .hero.has-img .hero-dot{background:rgba(255,255,255,.5);}
  .hero:not(.has-img) .hero-dot{background:rgba(23,27,34,.22);}
  .hero-dot.active{background:var(--amber); width:20px; border-radius:5px;}
  .hero-inner{position:relative; z-index:2; padding:60px 24px; max-width:1280px; margin:0 auto; width:100%; display:flex; align-items:center; justify-content:space-between; gap:44px;}
  .hero-text{max-width:580px; margin-left:-113px; animation:fadeUp .5s ease both;}
  .hero-eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; letter-spacing:.12em; color:var(--amber); margin-bottom:14px;}
  .hero-eyebrow::before{content:""; width:20px; height:2px; background:var(--amber);}
  .hero.has-img .hero-eyebrow{color:#8fb7f5;}
  .hero-text h1{font-size:52px; line-height:1.04; margin-bottom:16px; color:var(--text);}
  .hero.has-img .hero-text h1{color:#fff;}
  .hero-text p{color:var(--muted); font-size:15.5px; margin-bottom:30px; max-width:440px; line-height:1.6;}
  .hero.has-img .hero-text p{color:rgba(255,255,255,.88);}
  .discount-hex{width:118px; height:118px; background:linear-gradient(145deg,var(--amber),#1743a6); color:#fff; flex-shrink:0; flex-direction:column; box-shadow:0 18px 40px rgba(37,99,235,.30); animation:fadeUp .6s .1s ease both;}
  .discount-hex b{font-size:32px; line-height:1;}
  .discount-hex span{font-size:11px; font-weight:700; letter-spacing:.05em;}
  .btn{display:inline-flex; align-items:center; gap:8px; background:var(--amber); color:#fff; font-weight:700; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; padding:14px 28px; border-radius:6px; transition:.18s; box-shadow:0 6px 16px rgba(37,99,235,.24);}
  .btn:hover{background:#3b7ddb; transform:translateY(-2px); box-shadow:0 10px 22px rgba(37,99,235,.32);}
  .btn.outline{background:none; border:1px solid var(--line); color:var(--text); box-shadow:none;}
  .btn.outline:hover{border-color:var(--amber); color:var(--amber); transform:none; background:var(--amber-dim);}
  .btn.small{padding:9px 16px; font-size:11px;}
  .btn.danger-outline{background:none; border:1px solid var(--red); color:var(--red); box-shadow:none;}
  .btn.danger-outline:hover{background:rgba(216,52,42,.08);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  section.block{padding:58px 24px;}
  .block-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; gap:16px;}
  .block-head h2{font-size:25px;}
  .block-head .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); margin:0 18px;}
  .see-all{font-size:12px; font-weight:600; color:var(--steel); letter-spacing:.03em; white-space:nowrap; transition:.15s;}
  .see-all:hover{color:var(--amber);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(224px,1fr)); gap:22px; padding:6px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; position:relative; animation:fadeUp .4s ease both;
    transition:transform .12s ease-out, box-shadow .12s ease-out, border-color .12s ease-out; box-shadow:var(--shadow-sm); will-change:transform;}
  .card:hover{border-color:var(--steel); box-shadow:var(--shadow-lg); z-index:5;}
  .card-img{height:184px; display:flex; align-items:center; justify-content:center; font-size:54px; position:relative; overflow:hidden;}
  .card-img img{width:100%; height:100%; object-fit:cover;}
  .ribbon{position:absolute; top:12px; left:-6px; font-size:10px; font-weight:700; letter-spacing:.05em; padding:4px 12px 4px 14px; color:#fff; text-transform:uppercase; z-index:2; box-shadow:0 2px 8px rgba(23,27,34,.24);}
  .ribbon.new{background:var(--steel);}
  .ribbon.sale{background:var(--red);}
  .card-body{padding:14px 16px 17px;}
  .card-cat{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:5px;}
  .card-name{font-size:14.5px; font-weight:600; margin-bottom:9px; line-height:1.3;}
  .price-row{display:flex; align-items:center; gap:8px;}
  .price{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .price.strike{color:var(--muted); font-weight:500; text-decoration:line-through; font-size:12.5px;}
  .price.sale{color:var(--red);}

  .promo-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .promo{border-radius:12px; padding:36px 32px; min-height:210px; display:flex; flex-direction:column; justify-content:center; background-size:cover; background-position:center; position:relative; overflow:hidden; border:1px solid var(--line); transition:.2s; box-shadow:var(--shadow-sm);}
  .promo:hover{border-color:var(--steel); box-shadow:var(--shadow-md); transform:translateY(-3px);}
  .promo::after{content:"";position:absolute; inset:0; background:linear-gradient(100deg,rgba(255,255,255,.93) 0%, rgba(255,255,255,.8) 30%, rgba(255,255,255,.2) 58%, rgba(255,255,255,0) 78%);}
  .promo-c{position:relative; z-index:2; max-width:290px;}
  .promo h3{font-size:21px; margin-bottom:9px; line-height:1.2; color:var(--text);}
  .promo .code{font-size:12px; color:var(--amber); font-weight:600; margin-bottom:18px; letter-spacing:.03em;}

  .catstrip{display:flex; flex-wrap:wrap; gap:28px; justify-content:center; padding-bottom:8px;}
  .catitem{display:flex; flex-direction:column; align-items:center; gap:11px; flex-shrink:0; cursor:pointer; width:98px; animation:catFloat 3.4s ease-in-out infinite;}
  .catitem:nth-child(2n){ animation-delay:.3s; }
  .catitem:nth-child(3n){ animation-delay:.6s; }
  .catitem:nth-child(4n){ animation-delay:.9s; }
  .catitem:nth-child(5n){ animation-delay:1.2s; }
  @keyframes catFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .catitem .hex{width:80px; height:80px; background:var(--surface2); border:1px solid var(--line); font-size:31px; transition:.25s; box-shadow:var(--shadow-sm);}
  .catitem:hover{ animation-play-state:paused; }
  .catitem:hover .hex{border-color:var(--amber); background:var(--amber-dim); transform:translateY(-6px) scale(1.1) rotate(-4deg); box-shadow:var(--shadow-md);}
  .catitem span{font-size:12px; font-weight:600; text-align:center; transition:.2s;}
  .catitem:hover span{color:var(--amber);}

  .newsletter{background:linear-gradient(180deg,var(--surface),#f6f8fa); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:56px 24px; text-align:center;}
  .newsletter h2{font-size:25px; margin-bottom:9px;}
  .newsletter p{color:var(--muted); font-size:14px; margin-bottom:24px;}
  .nl-form{display:flex; max-width:420px; margin:0 auto; gap:10px;}
  .nl-form input{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 14px; color:var(--text); font-size:13px; outline:none;}
  .nl-form input:focus{border-color:var(--steel);}
  .partners{background:linear-gradient(180deg,var(--surface),#f6f8fa); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:40px 24px; text-align:center;}
  .partners h2{font-size:18px; letter-spacing:.08em; color:var(--muted); margin-bottom:26px;}
  .partners-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:40px; max-width:1100px; margin:0 auto;}
  .partner-logo{height:80px; display:flex; align-items:center;}
  .partner-logo img{height:100%; width:auto; max-width:220px; object-fit:contain;}

  footer{padding:52px 24px 26px; border-top:1px solid var(--line);}
  .foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:32px; margin-bottom:40px;}
  .foot-col h4{font-size:12px; letter-spacing:.06em; margin-bottom:16px; color:var(--muted);}
  .foot-col a, .foot-col p{display:block; font-size:13.5px; margin-bottom:10px; color:var(--text); opacity:.8; transition:.15s;}
  .foot-col a:hover{color:var(--amber); opacity:1;}
  .foot-bottom{display:flex; justify-content:space-between; align-items:center; padding-top:24px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); flex-wrap:wrap; gap:10px;}

  .pd-img{height:230px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:80px; margin-bottom:18px; overflow:hidden;}
  .pd-img img{width:100%; height:100%; object-fit:cover; cursor:zoom-in;}
  .lightbox-overlay{position:fixed; inset:0; background:rgba(0,0,0,.86); z-index:9999; display:flex; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}
  .lightbox-overlay img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .lightbox-close{position:absolute; top:18px; right:22px; background:rgba(255,255,255,.12); color:#fff; border:none; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:13px 24px; border-radius:9px; font-size:13.5px; z-index:200; font-weight:500; box-shadow:var(--shadow-lg); animation:fadeUp .2s ease both;}

  /* cart */
  .cart-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .cart-thumb{width:52px; height:52px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden;}
  .cart-thumb img{width:100%; height:100%; object-fit:cover;}
  .cart-info{flex:1; min-width:0;}
  .cart-name{font-size:13.5px; font-weight:600; margin-bottom:3px;}
  .cart-price{font-size:12px; color:var(--muted);}
  .qty-stepper{display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:5px 9px;}
  .qty-stepper button{background:none; color:var(--text); font-size:15px; width:16px; height:18px; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .qty-stepper button:hover{color:var(--amber);}
  .qty-stepper span{font-size:13px; font-weight:600; min-width:14px; text-align:center;}
  .cart-linetotal{font-size:13px; font-weight:700; min-width:72px; text-align:right;}
  .cart-remove{background:none; color:var(--muted); font-size:14px; width:26px; height:26px; border-radius:6px;}
  .cart-remove:hover{color:var(--red); background:rgba(216,52,42,.08);}
  .cart-total-row{display:flex; justify-content:space-between; align-items:center; padding-top:16px; margin-top:8px; font-size:17px; font-weight:700;}

  /* admin */
  .admin-shell{position:fixed; inset:0; background:var(--bg); z-index:90; display:flex;}
  .admin-sidebar{width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px;}
  .admin-sidebar .logo{padding:6px 10px 22px; font-size:16px;}
  .admin-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .admin-nav button{display:flex; align-items:center; gap:11px; background:none; color:var(--muted); font-size:13.5px; font-weight:600; padding:11px 12px; border-radius:8px; text-align:left; transition:.15s;}
  .admin-nav button span.ico{font-size:16px; width:20px; text-align:center;}
  .admin-nav button:hover{background:var(--surface2); color:var(--text);}
  .admin-nav button.active{background:linear-gradient(90deg, rgba(37,99,235,.14), rgba(37,99,235,.02)); color:var(--amber); border-left:2px solid var(--amber); padding-left:10px;}
  .admin-foot{display:flex; flex-direction:column; gap:6px; padding-top:14px; border-top:1px solid var(--line);}
  .admin-foot button{display:flex; align-items:center; gap:11px; background:none; color:var(--muted); font-size:13px; font-weight:600; padding:10px 12px; border-radius:8px; text-align:left;}
  .admin-foot button:hover{background:var(--surface2); color:var(--text);}
  .admin-main{flex:1; overflow-y:auto;}

/* ---------- sipariş bildirimleri: bu tarayıcıya özel Web Notification API kullanımı.
   Not: izin ve "açık/kapalı" durumu SADECE bu tarayıcıya kayıtlıdır (localStorage).
   Chrome, Edge, Firefox gibi her tarayıcıda ayrı ayrı etkinleştirilmesi gerekir, ve
   bildirimlerin gelebilmesi için site o tarayıcıda bir sekmede açık kalmalıdır
   (arka planda/simge durumunda küçültülmüş olabilir, ama tamamen kapalı olmamalı). ---------- */
let NOTIF = {
  enabled: (localStorage.getItem('kdr-notif-enabled')==='1'),
  lastOrderId: localStorage.getItem('kdr-notif-last-order') || null,
  timer: null
};
function notifSupported(){ return typeof Notification !== 'undefined'; }
function notifStatusLabel(){
  if(!notifSupported()) return 'Bu tarayıcı masaüstü bildirimlerini desteklemiyor.';
  if(Notification.permission==='denied') return 'Bildirimlere izin verilmemiş. Tarayıcının site ayarlarından izni açmanız gerekiyor.';
  if(NOTIF.enabled && Notification.permission==='granted') return '🟢 Bu tarayıcıda bildirimler AÇIK.';
  return '⚪ Bu tarayıcıda bildirimler KAPALI.';
}
async function enableNotifications(){
  if(!notifSupported()){ showToast('Bu tarayıcı masaüstü bildirimlerini desteklemiyor'); return; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ showToast('Bildirim izni verilmedi'); render(); return; }
  NOTIF.enabled = true;
  localStorage.setItem('kdr-notif-enabled','1');
  const latest = (DATA.orders && DATA.orders[0]) ? DATA.orders[0].id : null;
  NOTIF.lastOrderId = latest;
  localStorage.setItem('kdr-notif-last-order', latest || '');
  try{ new Notification('Bildirimler etkinleştirildi', { body:'Yeni siparişlerde bu tarayıcıda bildirim alacaksınız.' }); }catch(e){}
  startOrderWatcher();
  render();
  showToast('Bildirimler bu tarayıcıda açıldı');
}
function disableNotifications(){
  NOTIF.enabled = false;
  localStorage.setItem('kdr-notif-enabled','0');
  if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders=null; }
  render();
  showToast('Bildirimler bu tarayıcıda kapatıldı');
}
function fireOrderNotification(order){
  if(!notifSupported() || Notification.permission!=='granted') return;
  const name = order.customerName || 'Yeni müşteri';
  const total = (order.total||0).toLocaleString('tr-TR') + ' TL';
  try{
    const n = new Notification('🛒 Yeni Sipariş: ' + total, { body: name + ' bir sipariş verdi.', tag:'order-'+order.id });
    n.onclick = function(){ window.focus(); };
  }catch(e){}
}
function handleFreshStoreSnapshot(fresh){
  const orders = fresh.orders || [];
  if(!orders.length) return;
  const latestId = orders[0].id;
  if(NOTIF.enabled && NOTIF.lastOrderId && latestId !== NOTIF.lastOrderId){
    const idx = orders.findIndex(o=>o.id===NOTIF.lastOrderId);
    const newOnes = idx===-1 ? [orders[0]] : orders.slice(0, idx);
    newOnes.slice().reverse().forEach(o=>fireOrderNotification(o));
  }
  if(NOTIF.enabled){
    NOTIF.lastOrderId = latestId;
    localStorage.setItem('kdr-notif-last-order', latestId);
  }
  if(ADMIN.open && ADMIN.authed && ADMIN.tab==='siparisler'){ DATA.orders = orders; render(); }
}
let unsubscribeOrders = null;
function startOrderWatcher(){
  if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders=null; }
  if(!NOTIF.enabled) return;
  if(!firebaseReady || !storeDocRef) return;
  // Firestore gerçek zamanlı dinleyici: sipariş verilir verilmez (saniyeler içinde,
  // 20sn'lik kontrol beklemeden) bu tarayıcıya haber gelir.
  unsubscribeOrders = storeDocRef.onSnapshot(function(snap){
    if(!snap.exists) return;
    const val = snap.data().value;
    if(!val) return;
    let fresh;
    try{ fresh = JSON.parse(val); }catch(e){ return; }
    handleFreshStoreSnapshot(fresh);
  }, function(err){ console.error('Firestore dinleme hatası', err); });
}

function uuid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); }

/* ---------- storage: paylaşımlı veri (ürünler/siparişler/ayarlar) Firebase Firestore'da
   tek bir dokümanda tutuluyor — böylece hangi cihazdan/tarayıcıdan sipariş verilirse
   verilsin, yönetim paneli ve bildirim sistemi bunu anında görebiliyor. Sepet
   (shared:false) hâlâ sadece o ziyaretçinin kendi tarayıcısında, localStorage'da
   tutuluyor (paylaşılmasına gerek yok). window.storage varsa (Claude önizlemesi) o
   önceliklidir; yoksa Firestore denenir; o da başarısız olursa (ör. henüz
   firebaseConfig doldurulmadıysa) localStorage'a düşer. ---------- */
async function storageGet(key, shared){
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const r = await window.storage.get(key, shared);
      if(r) return r;
    }
  }catch(e){ /* devam et */ }
  if(shared && firebaseReady && storeDocRef){
    try{
      const snap = await storeDocRef.get();
      if(snap.exists){
        const val = snap.data().value;
        if(val) return { key, value:val, shared };
      }
    }catch(e){ console.error('Firestore okuma hatası', e); }
  }
  try{
    const raw = localStorage.getItem((shared?'kdr_shared_':'kdr_local_')+key);
    return raw!=null ? {key, value:raw, shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  let ok = false;
  try{
    if(window.storage && typeof window.storage.set==='function'){
      const r = await window.storage.set(key, value, shared);
      if(r) ok = true;
    }
  }catch(e){ /* devam et */ }
  if(shared && firebaseReady && storeDocRef){
    try{
      await storeDocRef.set({ value: value, updatedAt: Date.now() });
      ok = true;
    }catch(e){ console.error('Firestore yazma hatası', e); }
  }
  try{
    localStorage.setItem((shared?'kdr_shared_':'kdr_local_')+key, value);
    ok = true;
  }catch(e){ /* storage full or unavailable */ }
  return ok ? {key, value, shared} : null;
}

/* ---------- 3D tilt / grow hover effect on product cards ---------- */
function attachCardTilt(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('mousemove', onCardTiltMove);
    card.addEventListener('mouseleave', onCardTiltLeave);
  });
}
function onCardTiltMove(e){
  const card = e.currentTarget;
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5;
  const py = (e.clientY - r.top) / r.height - 0.5;
  const rotY = px * 16;
  const rotX = -py * 16;
  card.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.09,1.09,1.09) translateY(-6px)`;
}
function onCardTiltLeave(e){
  e.currentTarget.style.transform = '';
}

/* ---------- image upload ---------- */
/* Hedef: ~1MB'a kadar dosya boyutuna izin ver, çözünürlüğü olabildiğince yüksek tut.
   Önce büyük boyutta (maxDim'e göre) yüksek kalitede sıkıştırır, 1MB'ı aşarsa
   kaliteyi kademeli düşürerek hedefe yaklaşır; kalite dibe vurursa boyutu küçültür. */
const IMG_TARGET_BYTES = 1024 * 1024; // 1MB (data URL boyutu, base64 dahil)

function dataUrlBytes(dataUrl){
  // base64 kısmının yaklaşık byte karşılığı
  const b64 = dataUrl.split(',')[1] || '';
  return Math.round(b64.length * 0.75);
}

function compressToTarget(img){
  // Adım 1: makul bir üst sınır içinde orijinal çözünürlüğe olabildiğince yakın başla
  const maxDim = 2200; // yüksek çözünürlük üst sınırı (aşırı büyük fotoğraflar için)
  let w = img.width, h = img.height;
  if(w > maxDim || h > maxDim){
    if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
    else { w = Math.round(w * maxDim / h); h = maxDim; }
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let dataUrl = '';

  const render = (rw, rh) => {
    canvas.width = rw; canvas.height = rh;
    ctx.clearRect(0,0,rw,rh);
    ctx.drawImage(img, 0, 0, rw, rh);
  };

  render(w, h);

  // Adım 2: kaliteyi kademeli düşürerek 1MB hedefine yaklaş
  let quality = 0.92;
  dataUrl = canvas.toDataURL('image/jpeg', quality);
  while(dataUrlBytes(dataUrl) > IMG_TARGET_BYTES && quality > 0.5){
    quality -= 0.08;
    dataUrl = canvas.toDataURL('image/jpeg', quality);
  }

  // Adım 3: kalite dibe vurduysa (0.5) ve hâlâ 1MB üzerindeyse boyutu küçültmeye başla
  let tries = 0;
  while(dataUrlBytes(dataUrl) > IMG_TARGET_BYTES && tries < 6){
    w = Math.round(w * 0.85); h = Math.round(h * 0.85);
    render(w, h);
    dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    tries++;
  }

  return dataUrl;
}

function handleImageFile(event, hiddenId, previewId){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Lütfen bir görsel dosyası seçin'); return; }
  const hidden = document.getElementById(hiddenId);
  const prev = document.getElementById(previewId);
  showToast('Fotoğraf yükleniyor...');

  // Öncelik: Vercel Blob'a gerçek dosya olarak yükle (tam çözünürlük, sınırsıza yakın).
  // /api/upload yoksa (örn. Blob henüz bağlanmadıysa veya siteyi Vercel dışında
  // çalıştırıyorsanız) otomatik olarak yerel sıkıştırma+data URL yöntemine döner.
  uploadToBlob(file)
    .then(url => {
      if(hidden) hidden.value = url;
      if(prev){ prev.style.backgroundImage = `url(${url})`; prev.textContent=''; }
      showToast('Fotoğraf yüklendi (Vercel Blob)');
    })
    .catch(err => {
      console.warn('Blob yükleme kullanılamadı, yerel sıkıştırmaya dönülüyor:', err);
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const dataUrl = compressToTarget(img);
          if(hidden) hidden.value = dataUrl;
          if(prev){ prev.style.backgroundImage = `url(${dataUrl})`; prev.textContent=''; }
          const kb = Math.round(dataUrlBytes(dataUrl)/1024);
          showToast(`Fotoğraf yüklendi (yerel, ~${kb}KB)`);
        };
        img.onerror = () => showToast('Görsel okunamadı, farklı bir dosya deneyin');
        img.src = e.target.result;
      };
      reader.onerror = () => showToast('Dosya okunamadı');
      reader.readAsDataURL(file);
    });
}

async function uploadToBlob(file){
  const { upload } = await import('https://esm.sh/@vercel/blob@0.27.0/client');
  const blob = await upload(file.name, file, {
    access: 'public',
    handleUploadUrl: '/api/upload',
  });
  return blob.url;
}

let HERO_IDX = 0;
let HERO_TIMER = null;
function heroSlide(dir){
  const n = heroImages().length;
  if(n<2) return;
  HERO_IDX = (HERO_IDX + dir + n) % n;
  updateHeroSlidePosition();
  restartHeroAutoplay();
}
function heroGoTo(i){
  const n = heroImages().length;
  if(n<2) return;
  HERO_IDX = ((i % n) + n) % n;
  updateHeroSlidePosition();
  restartHeroAutoplay();
}
function updateHeroSlidePosition(){
  const track = document.getElementById('heroSlides');
  if(!track) return;
  const n = heroImages().length;
  track.style.transform = `translateX(-${HERO_IDX*(100/n)}%)`;
  document.querySelectorAll('#heroSlider .hero-dot').forEach((d,i)=>d.classList.toggle('active', i===HERO_IDX));
}
function restartHeroAutoplay(){
  if(HERO_TIMER) clearInterval(HERO_TIMER);
  const n = heroImages().length;
  if(n<2) return;
  HERO_TIMER = setInterval(()=>{ heroSlide(1); }, 5000);
}
function setupHeroSlider(){
  const el = document.getElementById('heroSlider');
  if(!el) { if(HERO_TIMER){ clearInterval(HERO_TIMER); HERO_TIMER=null; } return; }
  restartHeroAutoplay();
  let touchStartX = null;
  el.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(touchStartX==null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){ heroSlide(dx < 0 ? 1 : -1); }
    touchStartX = null;
  }, {passive:true});
  el.addEventListener('mouseenter', ()=>{ if(HERO_TIMER) clearInterval(HERO_TIMER); });
  el.addEventListener('mouseleave', ()=>{ restartHeroAutoplay(); });
}

async function doRegister(){
  const name = document.getElementById('acc-name').value.trim();
  const surname = document.getElementById('acc-surname').value.trim();
  const email = document.getElementById('acc-email').value.trim().toLowerCase();
  const password = document.getElementById('acc-password').value;
  const password2 = document.getElementById('acc-password2').value;
  const phone = document.getElementById('acc-phone').value.trim();
  const address = document.getElementById('acc-address').value.trim();
  if(!name || !surname || !email || !password || !phone || !address){ showToast('Lütfen tüm alanları doldurun'); return; }
  if(!email.includes('@') || !email.includes('.')){ showToast('Geçerli bir e-posta adresi girin'); return; }
  if(password.length < 6){ showToast('Şifre en az 6 karakter olmalı'); return; }
  if(password !== password2){ showToast('Şifreler eşleşmiyor'); return; }
  if(!DATA.customers) DATA.customers = [];
  if(DATA.customers.some(c=>c.email.toLowerCase()===email)){ showToast('Bu e-posta ile zaten bir hesap var, giriş yapın'); return; }
  const customer = {
    id: uuid(),
    name, surname, email, password,
    phone, address,
    createdAt: new Date().toISOString()
  };
  DATA.customers.push(customer);
  await saveData();
  CUSTOMER = customer;
  await saveCustomerSession();
  ACCOUNT.step='profile'; ACCOUNT.tab='profil';
  render();
  showToast('Kayıt tamamlandı, hoş geldiniz ' + name + '!');
}

async function doLogin(){
  const email = document.getElementById('acc-login-email').value.trim().toLowerCase();
  const password = document.getElementById('acc-login-password').value;
  if(!email || !password){ showToast('E-posta ve şifrenizi girin'); return; }
  const found = (DATA.customers||[]).find(c=>c.email.toLowerCase()===email && c.password===password);
  if(!found){ showToast('E-posta veya şifre hatalı'); return; }
  CUSTOMER = found;
  await saveCustomerSession();
  ACCOUNT.step='profile'; ACCOUNT.tab='profil';
  render();
  showToast('Giriş yapıldı, hoş geldiniz ' + found.name + '!');
}

async function saveProfileEdits(){
  if(!CUSTOMER) return;
  CUSTOMER.phone = document.getElementById('acc-edit-phone').value.trim();
  CUSTOMER.address = document.getElementById('acc-edit-address').value.trim();
  await saveData();
  render();
  showToast('Bilgileriniz güncellendi');
}

async function logoutCustomer(){

}

function toggleSearch(open){
  VIEW.searchOpen = open;
  if(!open){
    VIEW.searchTerm=''; VIEW.searchResults=null;
    if(VIEW.category==='__search'){ VIEW.page='home'; VIEW.category=null; }
  }
  render();
  if(open){ const input=document.getElementById('search-input'); if(input) input.focus(); }
}
function searchProducts(term){
  VIEW.searchTerm = term;
  if(!term.trim()){
    VIEW.page='home'; VIEW.category=null; VIEW.searchResults=null;
    render();
    return;
  }
  VIEW.page='category'; VIEW.category='__search';
  const q = term.trim().toLowerCase();
  VIEW.searchResults = DATA.products.filter(p =>
    p.name.toLowerCase().includes(q) || catName(p.category).toLowerCase().includes(q)
  );
  render();
  const input = document.getElementById('search-input');
  if(input){ input.focus(); const v=input.value; input.value=''; input.value=v; }
}

function goHome(){ VIEW = {page:'home', category:null, product:null, cartOpen:false, searchTerm:'', searchResults:null, searchOpen:false}; render(); }
function goCategory(id){ VIEW.page='category'; VIEW.category=id; VIEW.product=null; render(); window.scrollTo(0,0); }
function openProduct(id){ VIEW.product=id; render(); }
function closeProduct(){ VIEW.product=null; render(); }
function openCart(){ VIEW.cartOpen=true; render(); }
function closeCart(){ VIEW.cartOpen=false; render(); }

function addToCart(id, qty){
  qty = qty || 1;
  const existing = CART.find(c=>c.productId===id);
  if(existing) existing.qty += qty; else CART.push({productId:id, qty});
  VIEW.product = null;
  saveCart(); render(); showToast('Sepete eklendi');
}
function removeFromCart(id){ CART = CART.filter(c=>c.productId!==id); saveCart(); render(); }
function changeQty(id, delta){
  const item = CART.find(c=>c.productId===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ CART = CART.filter(c=>c.productId!==id); }
  saveCart(); render();
}
function clearCart(){
  if(!confirm('Sepeti boşaltmak istediğinize emin misiniz?')) return;
  CART=[]; saveCart(); render();
}
function placeOrder(){
  const items = cartItemsResolved();
  if(!items.length) return;
  if(!CUSTOMER){
    showToast('Siparişi tamamlamak için lütfen giriş yapın ya da kayıt olun');
    VIEW.cartOpen=false;
    ACCOUNT.open=true; ACCOUNT.step='start'; ACCOUNT.tab='profil';
    render();
    return;
  }
  const order = {
    id: uuid(), date: new Date().toISOString(),
    items: items.map(i=>({ id:i.id, name:i.name, qty:i.qty, price:i.unit, category:i.category, image:i.image||'' })),
    total: cartTotal(),
    customerId: CUSTOMER ? CUSTOMER.id : null,
    customerName: CUSTOMER ? (CUSTOMER.name+' '+CUSTOMER.surname) : '',
    customerEmail: CUSTOMER ? CUSTOMER.email : '',
    customerPhone: CUSTOMER ? CUSTOMER.phone : '',
    customerAddress: CUSTOMER ? CUSTOMER.address : ''
  };
  if(!DATA.orders) DATA.orders=[];
  DATA.orders.unshift(order);
  saveData();
  if(NOTIF.enabled){ fireOrderNotification(order); NOTIF.lastOrderId = order.id; localStorage.setItem('kdr-notif-last-order', order.id); }
  CART=[]; saveCart();
  VIEW.cartOpen=false;
  render();
  showToast(CUSTOMER ? 'Siparişiniz alındı! "Siparişlerim" bölümünden takip edebilirsiniz.' : 'Siparişiniz alındı! Sipariş takibi için hesap oluşturabilirsiniz.');
}

function render(){
  const active = document.activeElement;
  const focusId = active && active.id;
  let selStart=null, selEnd=null;
  if(focusId && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
    try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){}
  }
  const app = document.getElementById('app');
  let body = VIEW.page==='home' ? homeView() : categoryView();
  app.innerHTML = `
    ${headerHtml()}
    <main>${body}</main>
    ${footerHtml()}
    ${VIEW.product ? productModal() : ''}
    ${VIEW.cartOpen ? cartModal() : ''}
    ${ACCOUNT.open ? accountModal() : ''}
    ${ADMIN.open ? adminHtml() : ''}
    ${LIGHTBOX_IMG ? lightboxHtml() : ''}
  `;
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  attachCardTilt();
  setupHeroSlider();
}

function toggleOnSale(checked){
  const fields = document.getElementById('f-discount-fields');
  const pctEl = document.getElementById('f-discpct');
  const saleEl = document.getElementById('f-sale');
  if(checked){
    fields.style.display = '';
    if(!pctEl.value.trim() && !saleEl.value.trim()){
      pctEl.value = 10;
      syncSaleFromPct();
    }
  } else {
    fields.style.display = 'none';
    pctEl.value = '';
    saleEl.value = '';
  }
}
function syncSaleFromPct(){
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const pctEl = document.getElementById('f-discpct');
  const pct = parseFloat(pctEl.value);
  const saleEl = document.getElementById('f-sale');
  if(!pctEl.value.trim() || isNaN(pct)){ return; }
  if(price>0){ saleEl.value = Math.round(price * (1 - pct/100)); }
}
function syncPctFromSale(){
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const saleEl = document.getElementById('f-sale');
  const sale = parseFloat(saleEl.value);
  const pctEl = document.getElementById('f-discpct');
  if(!saleEl.value.trim() || isNaN(sale)){ pctEl.value=''; return; }
  if(price>0){ pctEl.value = Math.round((1 - sale/price)*100); }
}
function syncDiscountFromPrice(){
  const pctEl = document.getElementById('f-discpct');
  if(pctEl.value.trim()){ syncSaleFromPct(); }
  else { syncPctFromSale(); }
}
function saveProduct(editing){
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-cat').value;
  const image = document.getElementById('f-img').value.trim();
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const saleRaw = document.getElementById('f-sale').value;
  const salePrice = saleRaw ? parseFloat(saleRaw) : null;
  const isNew = document.getElementById('f-new').checked;
  const featured = document.getElementById('f-feat').checked;
  if(!name){ showToast('Lütfen ürün adı girin'); return; }
  if(document.getElementById('f-onsale').checked && !salePrice){ showToast('İndirimli için önce Fiyat (₺) alanını doldurun'); return; }
  if(editing==='new'){ DATA.products.unshift({ id:uuid(), name, category, price, salePrice, image, isNew, featured }); }
  else { const p = DATA.products.find(p=>p.id===editing); Object.assign(p, {name, category, price, salePrice, image, isNew, featured}); }
  ADMIN.editingProduct = null;
  saveData(); render(); showToast('Ürün kaydedildi');
}
function deleteProduct(id){
  if(!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
  DATA.products = DATA.products.filter(p=>p.id!==id);
  saveData(); render(); showToast('Ürün silindi');
}

function svgBarChart(labels, values, opts){
  opts = opts || {};
  const W = opts.width || 720, H = opts.height || 260;
  const padL = 54, padB = 34, padT = 16, padR = 16;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxV = Math.max(1, ...values);
  const n = values.length;
  const gap = n > 0 ? chartW / n : chartW;
  const barW = Math.max(6, gap * 0.55);
  const gridLines = 4;
  let gridSvg = '';
  for(let g=0; g<=gridLines; g++){
    const y = padT + chartH - (chartH * g/gridLines);
    const val = Math.round(maxV * g/gridLines);
    gridSvg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${y+4}" font-size="10" fill="var(--muted)" text-anchor="end">${val>=1000?Math.round(val/1000)+'B':val}</text>`;
  }
  let bars = '';
  values.forEach((v,i)=>{
    const bh = maxV>0 ? (v/maxV) * chartH : 0;
    const x = padL + gap*i + (gap-barW)/2;
    const y = padT + chartH - bh;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="var(--amber)"><title>${esc(labels[i])}: ${money(v)}</title></rect>`;
    bars += `<text x="${x+barW/2}" y="${padT+chartH+18}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-width:${W}px;">${gridSvg}${bars}</svg>`;
}
function adminReports(){
  const orders = DATA.orders || [];
  const totalRevenue = orders.reduce((s,o)=>s+(o.total||0),0);
  const totalItemsSold = orders.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0);
  const totalOrders = orders.length;
  const avgOrder = totalOrders ? totalRevenue/totalOrders : 0;

  // Aylık: son 12 ay
  const now = new Date();
  const monthLabels = [], monthRevenue = [], monthItems = [];
  for(let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear()+'-'+d.getMonth();
    monthLabels.push(d.toLocaleDateString('tr-TR', {month:'short', year:'2-digit'}));
    let rev = 0, items = 0;
    orders.forEach(o=>{
      const od = new Date(o.date);
      if(od.getFullYear()===d.getFullYear() && od.getMonth()===d.getMonth()){ rev += o.total||0; items += o.items.reduce((s,i)=>s+i.qty,0); }
    });
    monthRevenue.push(rev); monthItems.push(items);
  }

  // Yıllık: siparişlerin kapsadığı tüm yıllar
  const years = Array.from(new Set(orders.map(o=>new Date(o.date).getFullYear()))).sort();
  const yearLabels = years.length ? years.map(String) : [String(now.getFullYear())];
  const yearRevenue = yearLabels.map(y=>orders.filter(o=>new Date(o.date).getFullYear()===parseInt(y)).reduce((s,o)=>s+(o.total||0),0));
  const yearItems = yearLabels.map(y=>orders.filter(o=>new Date(o.date).getFullYear()===parseInt(y)).reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0));

  const isMonthly = ADMIN.reportView !== 'yearly';
  const labels = isMonthly ? monthLabels : yearLabels;
  const revenueVals = isMonthly ? monthRevenue : yearRevenue;
  const itemVals = isMonthly ? monthItems : yearItems;
  const periodRevenue = revenueVals[revenueVals.length-1] || 0;
  const periodItems = itemVals[itemVals.length-1] || 0;

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${money(totalRevenue)}</div><div class="l">Toplam Ciro (tüm zamanlar)</div></div>
    <div class="stat-card"><div class="n">${totalItemsSold}</div><div class="l">Toplam Satılan Ürün Adedi</div></div>
    <div class="stat-card"><div class="n">${totalOrders}</div><div class="l">Toplam Sipariş</div></div>
    <div class="stat-card"><div class="n">${money(avgOrder)}</div><div class="l">Ortalama Sipariş Tutarı</div></div>
  </div>
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <h3 style="margin:0;">Ciro Grafiği</h3>
      <div style="display:flex; gap:8px;">
        <button class="btn small ${isMonthly?'':'outline'}" onclick="setReportView('monthly')">Aylık (Son 12 Ay)</button>
        <button class="btn small ${isMonthly?'outline':''}" onclick="setReportView('yearly')">Yıllık</button>
      </div>
    </div>
    <div class="hint">${isMonthly ? 'Bu ayın' : ('Bu yılın')} cirosu: <b>${money(periodRevenue)}</b> · satılan ürün: <b>${periodItems}</b></div>
    ${orders.length ? svgBarChart(labels, revenueVals) : `<div class="empty" style="margin-top:14px;">Henüz sipariş yok, grafik burada görünecek.</div>`}
  </div>`;
}

      <button class="btn outline" onclick="addPartnerSlot()">+ Firma Ekle</button>
      <button class="btn" style="margin-left:10px;" onclick="savePartners()">Kaydet</button>
    </div>
  </div>`;
}
function addPartnerSlot(){
  DATA.partners = DATA.partners || [];
  DATA.partners.push({name:'', image:''});
  render();
}
function removePartner(i){
  DATA.partners.splice(i,1);
  saveData(); render(); showToast('Firma kaldırıldı');
}
function savePartners(){
  DATA.partners = (DATA.partners||[]).map((pt,i)=>({
    name: (document.getElementById(`pt-name-${i}`)||{}).value || '',
    image: (document.getElementById(`pt-img-${i}`)||{}).value.trim() || ''
  }));
  saveData(); render(); showToast('İşbirlikleri kaydedildi');
}
function adminBanner(){
  const h = DATA.hero;
  const images = heroImages();
  return `
  <div class="panel">
    <h3>Ana Banner (Hero)</h3>
    <div class="hint">Sitenin en üstündeki büyük görsel alanı. Birden fazla fotoğraf eklerseniz banner otomatik olarak yana kaydırmalı slayt gösterisine döner (en fazla 5 fotoğraf).</div>
    <label>Başlık</label><input type="text" id="h-title" value="${esc(h.title)}">
    <label>Alt Metin</label><textarea id="h-sub" rows="2">${esc(h.subtitle)}</textarea>
    <div class="row2">
      <div><label>Rozet Büyük Yazı (örn: %25, YENİ, KAMPANYA)</label><input type="text" id="h-disc" value="${esc(h.discount)}" placeholder="%25"></div>
      <div><label>Rozet Küçük Yazı (örn: İNDİRİM)</label><input type="text" id="h-disc-label" value="${esc(h.discountLabel||'İNDİRİM')}" placeholder="İNDİRİM"></div>
    </div>
    <label>Buton Metni</label><input type="text" id="h-btn" value="${esc(h.buttonText)}">
    ${[0,1,2,3,4].map(i=>`
    <div style="border-top:1px solid var(--line); padding-top:16px; margin-top:16px;">
      <label>Slayt Fotoğrafı ${i+1}${i===0?' (zorunlu değil, boş bırakılırsa slayt gösterilmez)':''}</label>
      ${uploadWidget(`h-img-${i}`,`h-img-preview-${i}`,`h-img-url-${i}`, images[i]||'', '🖼️')}
    </div>`).join('')}
    <button class="btn" style="margin-top:18px;" onclick="saveHero()">Kaydet</button>
  </div>
  <div class="panel">
    <h3>Promosyon Bannerları</h3>
    <div class="hint">Ana sayfadaki iki küçük kampanya kutusu.</div>
    ${DATA.promos.map((pr,i)=>`
    <div style="border-top:1px solid var(--line); padding-top:16px; margin-top:${i>0?'16px':'0'};">
      <label>Başlık ${i+1}</label><input type="text" id="p-title-${i}" value="${esc(pr.title)}">
      <div class="row2">
        <div><label>Kod / Not Metni</label><input type="text" id="p-code-${i}" value="${esc(pr.code)}"></div>
        <div><label>Buton Metni</label><input type="text" id="p-btn-${i}" value="${esc(pr.buttonText)}"></div>
      </div>
      <label>Bağlı Kategori</label>
      <select id="p-cat-${i}">${DATA.categories.map(c=>`<option value="${c.id}" ${c.id===pr.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      ${uploadWidget(`p-img-${i}`,`p-img-preview-${i}`,`p-img-url-${i}`, pr.image, '🖼️')}
    </div>`).join('')}
    <button class="btn" style="margin-top:18px;" onclick="savePromos()">Kaydet</button>
  </div>`;
}
function saveHero(){
  const images = [0,1,2,3,4]
    .map(i=>{ const el = document.getElementById(`h-img-${i}`); return el ? el.value.trim() : ''; })
    .filter(Boolean);
  DATA.hero = {
    title: document.getElementById('h-title').value,
    subtitle: document.getElementById('h-sub').value,
    discount: document.getElementById('h-disc').value,
    discountLabel: document.getElementById('h-disc-label').value,
    buttonText: document.getElementById('h-btn').value,
    images: images
  };
  HERO_IDX = 0;
  saveData(); render(); showToast('Hero banner kaydedildi');
}
function savePromos(){
  DATA.promos = DATA.promos.map((pr,i)=>({
    title: document.getElementById(`p-title-${i}`).value,
    code: document.getElementById(`p-code-${i}`).value,
    buttonText: document.getElementById(`p-btn-${i}`).value,
    category: document.getElementById(`p-cat-${i}`).value,
    image: document.getElementById(`p-img-${i}`).value.trim()
  }));
  saveData(); render(); showToast('Bannerlar kaydedildi');
}

function adminCategories(){
  return `
  <div class="panel">
    <h3>Kategoriler</h3>
    <div class="hint">Kategori adını, emoji simgesini ve simge fotoğrafını buradan düzenleyebilirsiniz. Fotoğraf yüklerseniz simgede emoji yerine o görsel gösterilir. Silmeden önce o kategorideki ürünleri başka kategoriye taşıyın.</div>
    ${DATA.categories.map((c,i)=>`
    <div style="border-top:1px solid var(--line); padding-top:18px; margin-top:${i>0?'18px':'0'};">
      <div class="row2">
        <div><label>Kategori Adı</label><input type="text" value="${esc(c.name)}" onchange="renameCategory(${i}, this.value)"></div>
        <div><label>Emoji Simge</label><input type="text" value="${esc(c.icon || catIcon(c.id))}" maxlength="6" onchange="updateCategoryIcon(${i}, this.value)"></div>
      </div>
      ${uploadWidget(`c-img-${i}`,`c-img-preview-${i}`,`c-img-url-${i}`, c.image||'', c.icon || catIcon(c.id))}
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
        <button class="btn small" onclick="saveCategoryImage(${i})">Simge Görselini Kaydet</button>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="hint" style="margin:0;">${DATA.products.filter(p=>p.category===c.id).length} ürün</span>
          <button class="btn small danger-outline" onclick="deleteCategory('${c.id}')">Kategoriyi Sil</button>
        </div>
      </div>
    </div>`).join('')}
    <div style="display:flex; gap:10px; margin-top:22px; border-top:1px solid var(--line); padding-top:18px;">
      <input type="text" id="new-cat-name" placeholder="Yeni kategori adı">
      <button class="btn small" onclick="addCategory()">+ Ekle</button>
    </div>
  </div>`;
}
function renameCategory(i, val){ DATA.categories[i].name = val; saveData(); showToast('Kategori güncellendi'); }
function updateCategoryIcon(i, val){ DATA.categories[i].icon = val.trim() || catIcon(DATA.categories[i].id); saveData(); render(); showToast('Simge güncellendi'); }
function saveCategoryImage(i){
  const url = document.getElementById(`c-img-${i}`).value.trim();
  DATA.categories[i].image = url;
  saveData(); render(); showToast('Simge görseli kaydedildi');
}
function addCategory(){
  const input = document.getElementById('new-cat-name');
  const name = input.value.trim();
  if(!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9ığüşöç]+/gi,'-') + '-' + Date.now().toString(36).slice(-4);
  DATA.categories.push({id, name, icon:'🔧', image:''});
  saveData(); render(); showToast('Kategori eklendi');
}
function deleteCategory(id){
  if(DATA.products.some(p=>p.category===id)){ showToast('Bu kategoride ürün var, önce ürünleri taşıyın'); return; }
  if(!confirm('Kategoriyi silmek istediğinize emin misiniz?')) return;
  DATA.categories = DATA.categories.filter(c=>c.id!==id);
  saveData(); render(); showToast('Kategori silindi');
}

function adminSettings(){
  const logo = DATA.logo || { image:'', size:40 };
  return `
  <div class="panel">
    <h3>Logo</h3>
    <div class="hint">Kendi logo görselinizi yükleyin ve başlıktaki boyutunu ayarlayın. Görsel yüklemezseniz varsayılan "5S" simgesi gösterilir.</div>
    ${uploadWidget('s-logo-img','s-logo-preview','s-logo-url', logo.image, '🏷️')}
    <label style="margin-top:14px;">Logo Boyutu: <span id="s-logo-size-label">${logo.size}px</span></label>
    <input type="range" id="s-logo-size" min="24" max="80" step="2" value="${logo.size}" oninput="document.getElementById('s-logo-size-label').textContent=this.value+'px';">
    <div class="hint" style="margin-top:6px;">Kaydettikten sonra sitenin üst kısmındaki logoda yeni boyutu göreceksiniz.</div>
    <button class="btn" style="margin-top:18px;" onclick="saveLogo()">Logoyu Kaydet</button>
  </div>
  <div class="panel">
    <h3>Site Ayarları</h3>
    <label>Site Adı</label><input type="text" id="s-name" value="${esc(DATA.siteName)}">
    <label>Duyuru Bandı Metni</label><input type="text" id="s-announce" value="${esc(DATA.announcement)}">
    <button class="btn" style="margin-top:18px;" onclick="saveSettings()">Kaydet</button>
  </div>
  <div class="panel">
    <h3>🔔 Sipariş Bildirimleri</h3>
    <div class="hint">Bir müşteri sipariş verdiğinde bu tarayıcıda (Windows üzerinde Chrome, Edge, Firefox vb.) masaüstü bildirimi almak için etkinleştirin.</div>
    <div class="hint" style="margin-top:8px;">Önemli: İzin ve "açık/kapalı" durumu sadece kullandığınız tarayıcıya kayıtlıdır. Bildirimleri hem Chrome'da hem Firefox'ta almak istiyorsanız her ikisinde de ayrı ayrı "Etkinleştir" butonuna basmanız gerekir. Ayrıca bildirimlerin gelebilmesi için site o tarayıcıda bir sekmede açık kalmalı (simge durumuna küçültülmüş/arka planda olabilir, ama tarayıcı tamamen kapalıyken bildirim gelmez).</div>
    <p style="margin-top:12px; font-size:13px; font-weight:600;">${notifStatusLabel()}</p>
    ${NOTIF.enabled && notifSupported() && Notification.permission==='granted'
      ? `<button class="btn danger-outline" style="margin-top:14px;" onclick="disableNotifications()">Bildirimleri Kapat</button>`
      : `<button class="btn" style="margin-top:14px;" onclick="enableNotifications()">🔔 Bildirimleri Etkinleştir</button>`}
  </div>
  <div class="panel">
    <h3>Verileri Sıfırla</h3>
    <div class="hint">Tüm ürünleri, bannerları, siparişleri ve ayarları varsayılan demo verilerine döndürür. Bu işlem geri alınamaz.</div>
    <button class="btn danger-outline" onclick="resetAll()">Varsayılanlara Sıfırla</button>
  </div>`;
}
function saveLogo(){
  const image = document.getElementById('s-logo-img').value.trim();
  const size = parseInt(document.getElementById('s-logo-size').value, 10) || 40;
  DATA.logo = { image, size };
  saveData(); render(); showToast('Logo kaydedildi');
}
function saveSettings(){
  DATA.siteName = document.getElementById('s-name').value;
  DATA.announcement = document.getElementById('s-announce').value;
  saveData(); render(); showToast('Ayarlar kaydedildi');
}
function resetAll(){
  if(!confirm('Tüm veriler sıfırlanacak. Emin misiniz?')) return;
  DATA = defaultData();
  saveData(); render(); showToast('Veriler sıfırlandı');
}

loadData();
</script>
</body>
</html>
